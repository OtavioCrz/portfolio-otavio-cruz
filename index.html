<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Sem JavaScript, o conteúdo pré-renderizado fica legível: some a
         cortina do preloader e os depoimentos deixam de se sobrepor. -->
    <noscript>
      <style>
        [data-preloader] { display: none !important; }
        #depoimentos { height: auto !important; }
        [data-quote] { grid-area: auto !important; }
      </style>
    </noscript>

    <!-- ================================================================
         SEO TÉCNICO
         As URLs absolutas abaixo usam o domínio definido em VITE_SITE_URL,
         no arquivo .env da raiz. Troque o domínio LÁ — um lugar só.
         og:image, og:url, canonical e o JSON-LD precisam de URL absoluta:
         caminho relativo quebra o preview no WhatsApp, LinkedIn e X.

         Estas tags ficam no HTML estático (e não num React Helmet) porque
         os robôs de preview não executam JavaScript.
         ================================================================ -->
    <title>Otávio Cruz | Desenvolvedor Front-End &amp; Web Designer Premium</title>
    <meta
      name="description"
      content="Especialista em criar sites de alta performance, animações fluidas e design focado em conversão para marcas que buscam exclusividade."
    />
    <meta name="author" content="Otávio Cruz" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph — WhatsApp, LinkedIn, Facebook, Slack, Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Otávio Cruz" />
    <meta property="og:title" content="Otávio Cruz | Desenvolvedor Front-End &amp; Web Designer Premium" />
    <meta
      property="og:description"
      content="Especialista em criar sites de alta performance, animações fluidas e design focado em conversão para marcas que buscam exclusividade."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />

    <!-- ▼▼ IMAGEM DE PREVIEW (og-image.jpg) ▼▼
         O arquivo está em public/og-image.jpg e é publicado na raiz do
         site, então a URL abaixo já aponta para ele assim que o domínio
         do .env estiver certo.
         Para trocar a imagem: substitua public/og-image.jpg mantendo o
         nome (1200x630, JPG, idealmente abaixo de 300 KB). Se preferir
         hospedar em outro lugar, cole a URL completa aqui E em twitter:image. -->
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Otávio Cruz — Desenvolvedor Front-End &amp; Web Designer" />
    <!-- ▲▲ IMAGEM DE PREVIEW ▲▲ -->

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Otávio Cruz | Desenvolvedor Front-End &amp; Web Designer Premium" />
    <meta
      name="twitter:description"
      content="Especialista em criar sites de alta performance, animações fluidas e design focado em conversão para marcas que buscam exclusividade."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="Otávio Cruz — Desenvolvedor Front-End &amp; Web Designer" />

    <!-- Dados estruturados (schema.org) — identidade: Person, ProfessionalService, WebSite.
         O catálogo de serviços (#servicos) e o FAQ (#faq) vêm logo abaixo. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "%VITE_SITE_URL%/#otavio-cruz",
            "name": "Otávio Cruz",
            "jobTitle": "Desenvolvedor Front-End & Web Designer",
            "description": "Especialista em criar sites de alta performance, animações fluidas e design focado em conversão para marcas que buscam exclusividade.",
            "url": "%VITE_SITE_URL%/",
            "worksFor": { "@id": "%VITE_SITE_URL%/#negocio" },
            "hasOfferCatalog": { "@id": "%VITE_SITE_URL%/#servicos" },
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Fortaleza",
              "addressRegion": "CE",
              "addressCountry": "BR"
            },
            "knowsAbout": [
              "Desenvolvimento Front-End",
              "Web Design",
              "Design de Interfaces",
              "Landing Pages",
              "Sites Institucionais",
              "Animação Web",
              "Performance Web",
              "SEO Técnico",
              "React",
              "Vite",
              "GSAP",
              "Tailwind CSS",
              "Supabase"
            ],
            "sameAs": ["https://github.com/otaviocrz"],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "sales",
              "telephone": "+55-85-98852-8359",
              "url": "https://wa.me/5585988528359",
              "availableLanguage": "pt-BR"
            }
          },
          {
            "@type": "ProfessionalService",
            "@id": "%VITE_SITE_URL%/#negocio",
            "name": "Otávio Cruz — Desenvolvimento Web & Design",
            "description": "Landing pages de alta conversão, sites institucionais premium e otimização de performance e SEO para empresas de qualquer nicho no Brasil e em Portugal.",
            "url": "%VITE_SITE_URL%/",
            "image": "%VITE_SITE_URL%/og-image.jpg",
            "telephone": "+55-85-98852-8359",
            "founder": { "@id": "%VITE_SITE_URL%/#otavio-cruz" },
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Fortaleza",
              "addressRegion": "CE",
              "addressCountry": "BR"
            },
            "areaServed": [
              { "@type": "Country", "name": "Brasil" },
              { "@type": "Country", "name": "Portugal" }
            ],
            "knowsLanguage": "pt-BR",
            "hasOfferCatalog": { "@id": "%VITE_SITE_URL%/#servicos" },
            "sameAs": ["https://github.com/otaviocrz"]
          },
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#website",
            "url": "%VITE_SITE_URL%/",
            "name": "Otávio Cruz — Portfólio",
            "description": "Especialista em criar sites de alta performance, animações fluidas e design focado em conversão para marcas que buscam exclusividade.",
            "inLanguage": "pt-BR",
            "author": { "@id": "%VITE_SITE_URL%/#otavio-cruz" },
            "publisher": { "@id": "%VITE_SITE_URL%/#otavio-cruz" }
          }
        ]
      }
    </script>
    <!-- O comentário abaixo é trocado no build (scripts/prerender.mjs) pelo JSON-LD
         de OfferCatalog + FAQPage, gerado dos mesmos dados das seções. -->
    <!-- app:structured-data -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
