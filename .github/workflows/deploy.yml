# Build do Vite e publicação no GitHub Pages a cada push na main.
#
# O Pages do repositório precisa estar com a fonte "GitHub Actions"
# (Settings → Pages → Build and deployment → Source). O domínio
# otaviocruz.com.br fica nessa tela: com deploy por Actions o GitHub ignora
# o arquivo public/CNAME, que existe só como registro do domínio.
name: Deploy — GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo não interrompe o que já está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # vite build + scripts/generate-sitemap.mjs (sitemap.xml e robots.txt)
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
